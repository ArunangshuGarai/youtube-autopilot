name: Voice Lab (listen and pick a voice)

# Renders the same thriller + comedy lines in many free voices. Download the artifact, listen, then set the
# repo variables VOICE_GRAVE / VOICE_TENSE / VOICE_JOLLY / VOICE_SARCASTIC (and TTS_PROVIDER=edge if you prefer edge-tts).
on:
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install system packages (FFmpeg, Cairo, fonts, eSpeak for Kokoro)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng libsndfile1 libcairo2-dev pkg-config python3-dev

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Packages
        run: pip install -r requirements.txt

      - name: Cache Kokoro-82M voice weights
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.onnx
            voices-v1.0.bin
          key: kokoro-model-files-v1.0

      - name: Download Kokoro-82M voice weights
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o kokoro-v1.0.onnx
          curl -fsSL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o voices-v1.0.bin

      - name: Cache Whisper model (caption timing)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en-v1

      - name: Render voice samples
        run: python -m studio.voice_lab

      - name: Upload samples
        uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: build/voice_lab/*.m4a
