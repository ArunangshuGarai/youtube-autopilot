name: Preview Short (no upload)

# Renders a full Short and attaches it as a downloadable artifact. Nothing is posted to YouTube.
on:
  workflow_dispatch:
    inputs:
      genre:
        description: 'Genre'
        type: choice
        options: [comedy, crime, thriller]
        default: comedy
      live:
        description: 'Write a NEW story with Gemini (otherwise renders the built-in sample story)'
        type: boolean
        default: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install system packages (FFmpeg, Cairo, fonts, eSpeak for Kokoro)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng libsndfile1 libcairo2-dev pkg-config python3-dev

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Packages
        run: pip install -r requirements.txt

      - name: Cache Kokoro-82M voice weights
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.onnx
            voices-v1.0.bin
          key: kokoro-model-files-v1.0

      - name: Download Kokoro-82M voice weights
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o kokoro-v1.0.onnx
          curl -fsSL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o voices-v1.0.bin

      - name: Cache Whisper model (caption timing)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en-v1

      - name: Render preview
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          VOICE_GRAVE: ${{ vars.VOICE_GRAVE }}
          VOICE_TENSE: ${{ vars.VOICE_TENSE }}
          VOICE_JOLLY: ${{ vars.VOICE_JOLLY }}
          VOICE_SARCASTIC: ${{ vars.VOICE_SARCASTIC }}
          GEMINI_TEXT_MODELS: ${{ vars.GEMINI_TEXT_MODELS }}
        run: python -m studio --genre ${{ inputs.genre }} ${{ inputs.live && '--live' || '' }} --out preview.mp4

      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-short
          path: |
            preview.mp4
            build/thumbnail.jpg
            build/storyboard.json
          if-no-files-found: ignore
