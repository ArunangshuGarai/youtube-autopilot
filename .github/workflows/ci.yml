name: Syntax check (Python 3.11)

# The scheduled runner uses Python 3.11; newer Python versions accept syntax that 3.11 rejects.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all Python files
        run: python -m compileall -q autonomous_engine.py studio
      - name: Install test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libcairo2-dev pkg-config python3-dev
          pip install pycairo numpy pillow requests
      - name: Offline unit tests (packaging, script engine, quota handling, learning)
        run: python -m unittest discover tests
