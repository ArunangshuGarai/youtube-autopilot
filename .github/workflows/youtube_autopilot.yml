name: Autonomous YouTube Studio

on:
  schedule:
    - cron: '0 14,19,0 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs overlap: they would race on memory.json and double-post.
concurrency:
  group: youtube-autopilot
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg, Fonts & eSpeak-NG for Kokoro Neural Voice
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng libsndfile1

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Packages
        run: pip install google-genai google-api-python-client google-auth google-auth-httplib2 kokoro-onnx soundfile numpy gradio_client edge-tts requests pillow

      - name: Cache Kokoro-82M Voice Weights
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.onnx
            voices-v1.0.bin
          key: kokoro-model-files-v1.0

      - name: Download Kokoro-82M Human Voice Weights
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o kokoro-v1.0.onnx
          curl -fsSL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o voices-v1.0.bin

      - name: Execute Autonomous Studio Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Optional but strongly recommended: authenticated Hugging Face quota for FLUX.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Optional: set repo variable GEMINI_IMAGE_MODEL to an image-capable Gemini model name.
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: python autonomous_engine.py

      - name: Upload Build Folder on Failure (debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: build/
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit Updated Memory & Analytics Log
        run: |
          git config user.name "youtube-autopilot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memory.json
          git diff --staged --quiet || (git commit -m "chore: update published story memory" && git pull --rebase && git push)
