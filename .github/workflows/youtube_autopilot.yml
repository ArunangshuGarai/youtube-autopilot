name: Autonomous YouTube Studio

on:
  schedule:
    - cron: '0 14,19,0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg, Fonts & eSpeak-NG for Kokoro Neural Voice
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng libsndfile1

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Packages
        run: pip install google-genai google-api-python-client google-auth google-auth-httplib2 kokoro-onnx soundfile numpy gradio_client edge-tts requests pillow

      - name: Download Kokoro-82M Human Voice Weights
        run: |
          curl -sL https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o kokoro-v1.0.onnx
          curl -sL https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o voices-v1.0.bin

      - name: Execute Autonomous Studio Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python autonomous_engine.py

      - name: Commit Updated Memory & Analytics Log
        run: |
          git config user.name "youtube-autopilot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memory.json
          git diff --staged --quiet || (git commit -m "chore: update published story memory" && git pull --rebase && git push)
