name: Autonomous YouTube Studio

on:
  schedule:
    - cron: '0 14,19,0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  models: read

# Never let two runs overlap: they would race on memory.json and double-post.
concurrency:
  group: youtube-autopilot
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install system packages (FFmpeg, Cairo, fonts, eSpeak for Kokoro)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng libsndfile1 libcairo2-dev pkg-config python3-dev

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Packages
        run: pip install -r requirements.txt

      - name: Cache Kokoro-82M voice weights
        id: kokoro-cache
        uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.onnx
            voices-v1.0.bin
          key: kokoro-model-files-v1.0

      - name: Download Kokoro-82M voice weights
        if: steps.kokoro-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx -o kokoro-v1.0.onnx
          curl -fsSL --retry 3 https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin -o voices-v1.0.bin

      - name: Cache Whisper model (caption timing)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en-v1

      - name: Write, animate, voice and publish a Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Optional tuning (Settings > Secrets and variables > Actions > Variables). Empty = defaults.
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          VOICE_GRAVE: ${{ vars.VOICE_GRAVE }}
          VOICE_TENSE: ${{ vars.VOICE_TENSE }}
          VOICE_JOLLY: ${{ vars.VOICE_JOLLY }}
          VOICE_SARCASTIC: ${{ vars.VOICE_SARCASTIC }}
          GEMINI_TEXT_MODELS: ${{ vars.GEMINI_TEXT_MODELS }}
          FORCE_GENRE: ${{ vars.FORCE_GENRE }}
        run: python autonomous_engine.py

      - name: Upload build folder on failure (debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug
          path: build/
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit updated memory
        run: |
          git config user.name "youtube-autopilot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memory.json
          git diff --staged --quiet || (git commit -m "chore: update published story memory" && git pull --rebase && git push)
